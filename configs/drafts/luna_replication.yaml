# DRAFT, not declared. Written 24 October 2026 after the results of channel_c1, notes_luna, notes_deepseek,
# placebo_replay and narrow_costs had been seen, and before the results of channel_extensions and luna_long (H19). It
# counts as declared only once the author approves it, it is moved into configs/analysis.yaml as section
# `luna_replication`, and that is committed; no session of luna_replication starts before that commit.
#
# Launch condition: the author decides whether to launch after H19 (luna_long) is analysed; the draft expects a launch
# if H19 is not supported. Whatever H19 shows, this run is a fresh confirmatory test on new seeds; the report states
# that it was launched after H19 and why.
#
# Why: GPT-6 Luna's C1 effect is small (H5 +0.111, SD 0.17, Holm p = 0.041, 12 pairs), and the comparison that says
# messages, not shared notes, raise its price (C1 minus M2, +0.176, SD 0.30, p = 0.13) was never powered. At those
# SDs, 24 pairs give about 80% power for each (two-sided alpha 0.05, Holm over the two).

luna_replication:
  run_id: luna_replication
  configs:                               # to write with the declaration
    B0: configs/lunarep_b0.yaml
    M2: configs/lunarep_m2.yaml
    C1: configs/lunarep_c1.yaml
  baseline: luna_replication             # all three arms are in this run (new seeds)

  design:
    n_bidders: 2
    model: gpt-luna                      # OpenAI, reasoning effort high, no temperature sent, caching off (cache_writes false)
    costs: private, i.i.d. uniform 0 to 100 each round
    n_rounds: 50                         # as channel_c1 and notes_luna, so H25 and H26 are on H5's horizon
    tie_break_rule: random
    info_condition: full
    history_window: null
    bid_increment: 0.01
    reserve_price: 100
    prompt: prompts/bidder_system.md     # v1
    max_output_tokens: 4000
    arms:
      B0: no channel, no workspace       # as baseline_no_channel's history arm
      M2: shared notes workspace         # as notes_luna M2 (configs/notes_luna_shared.yaml): shared, 1,000 characters per note, 4 requests per reflection step, firms not told the other reads it
      C1: open channel                   # as channel_c1 (500 characters)
    seeds: 998000-998023                 # new; no earlier session uses them
    n_pairs: 24                          # fixed. No seed is added after any result has been seen
    one_shot_control: none
    budget: >-
      about $9 at list prices - B0 and C1 about $3.4 for 48 sessions (scaled from luna_long, $4.84 for 24 sessions of
      100 rounds), M2 about $5.3 for 24 sessions (notes_luna M2: 4,382 calls at a mean 4,495 prompt and 315 completion
      tokens per 12 sessions). Tripwire the dry-run estimate. Messages judge on C1 about $1.9; notes judge on M2 not
      declared here
    launch_order: B0, C1, M2 on the OpenAI lane, one config at a time; beside DeepInfra runs

  unit: session

  confirmatory:
    - id: H25_luna_messages_raise_price_replication
      claim: on 24 new seeds, GPT-6 Luna able to send messages ends at a higher price level than without a channel
      contrast: C1 minus B0, paired by seed
      outcome: collusion_index           # unclipped (analysis/metrics.py)
      null: the mean difference over the 24 pairs is 0
      test: paired sign-flip permutation test on the mean difference, two-sided   # above 20 pairs, 100,000 random sign patterns, seed 20261010 (analysis/stats.py)
      alpha: 0.05
      holm: luna_replication             # over H25 and H26
      supported_if: the Holm-adjusted p is below alpha and the mean difference is positive

    - id: H26_luna_messages_beat_shared_notes
      claim: on the same seeds, GPT-6 Luna able to send messages ends at a higher price level than with a shared notes workspace
      contrast: C1 minus M2, paired by seed
      outcome: collusion_index
      null: the mean difference over the 24 pairs is 0
      test: as H25
      alpha: 0.05
      holm: luna_replication
      supported_if: the Holm-adjusted p is below alpha and the mean difference is positive

  reported: mean and median difference, SD, a 95% percentile bootstrap interval of the mean (10,000 resamples of whole
            pairs), positive pairs out of 24, raw and adjusted p. Sensitivity - Wilcoxon signed-rank on the same values

  reading:
    H25_supported: Luna's channel effect replicates at 50 rounds on new seeds; read beside H5 and H19
    H25_null: the 50-round effect does not replicate; reported beside H5 and H19, not as overturning them
    H26_supported: for Luna, messages raise the price more than shared notes, as for DeepSeek (C1 minus M2 in notes_deepseek)
    H26_null: no evidence that the channel beats shared notes for Luna; the claim "messages, not notes" is then made for DeepSeek only
    price_without_text: as channel_c1

  secondary:                             # same test, Holm within this family per contrast
    - markup_ratio
    - bid_gap
    - joint_profit_ratio
    - switch_gain
  secondary_contrasts:                   # collusion_index, same test, each alone
    - M2 minus B0, paired by seed        # shared notes against no channel (as notes_luna's H3/H4 path)
    - pooled C1 minus B0 over 36 pairs   # the 12 pairs of channel_c1 (H5, seeds 996000-996011) and these 24; labelled
                                         # secondary, never reported in place of H25. luna_long (100 rounds) is not pooled

  descriptive:
    - channel use and the messages-v1 labels for C1, as channel_c1 (every communication step judged; judged steps
      reported per model, with steps that had neither thinking nor a message counted and named)
    - the block index by 10-round block, by arm, with 95% bootstrap intervals over sessions
    - workspace use for M2 as notes_luna

  cost_leakage:
    decision: allow and measure, as in channel_c1

  exclusions:
    - A session that ends `failed` is rerun on the same seed, host and settings, at most 3 times. Its partial log is
      discarded, not merged.
    - A pair enters a test only if both of its sessions are `complete`. A seed that cannot be completed is dropped for
      that contrast, named in the report, and not replaced by a new seed.
    - A round in which a firm submits no valid bid stays in the session as the runner logged it.
    - No session is excluded for its bids, its messages, its notes or its outcome.
    - Sensitivity, reported beside the main result - each test again without pairs in which either session has
      invalid_bid_rate above 0.05.
    - Hosts never switch inside a session.

  limits:
    - Luna caching is off here and was on in channel_c1 and notes_luna (billing only; the model receives the same text)
    - the run was launched after H19 was seen; this decides whether it ran, not what it tests

  reporting:
    - Every confirmatory and secondary result is reported, whether or not it supports the claim.
    - Any analysis thought of after the run has been seen is labelled exploratory.
    - scripts/check_logs.py is run on the raw logs before any result is computed.
    - The tests are run by analyze.py logs/luna_replication (analysis/channel.py, CONTRASTS H25-H26), committed before
      this section.
