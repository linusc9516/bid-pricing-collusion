# DRAFT TEMPLATE, not declared. Written 24 October 2026 before the extension rule of channel_extensions has been
# computed. Filled in only for the cells and arms that the declared rule selects (extension_check.csv: rounds 41-50 mean
# above rounds 21-30 mean, and the two 95% bootstrap intervals do not overlap). If no cell is selected, this is not run.
# It counts as declared only once the author approves it, it is moved into configs/analysis.yaml as section
# `extension_100` with the cells filled in, and that is committed; no session starts before that commit.
#
# The extension is fixed by the channel_extensions declaration: a new pair of cells, B0 and the arm, both at 100
# rounds, on the same seeds. Nothing in channel_extensions is retested on the extended sessions.

extension_100:
  run_id: extension_100
  configs: one configs/ext100_<cell>.yaml per selected cell, as the ext_r*.yaml of that cell with n_rounds 100
  baseline: extension_100                # the 100-round B0 sessions are in this run

  design:
    as: channel_extensions, cell by cell (model, host, reasoning effort, channel settings, prompt v1)
    n_rounds: 100                        # the prompt does not announce the number of rounds
    seeds: 996000-996011                 # as channel_extensions, so the costs of rounds 1-50 are those of the 50-round sessions
    n_pairs_per_contrast: 12             # fixed
    cells: TO FILL from extension_check.csv - each selected (cell, arm); B0 at 100 rounds once per cell, shared by
           every selected arm of that cell (DeepSeek's C1cap and C1notice share the DeepSeek N = 2 B0)
    budget: about twice the 50-round pair of each cell (paper_plan.md, round length); tripwire the dry-run estimate

  unit: session

  confirmatory:                          # one hypothesis per selected (cell, arm), numbered from H27 in the order of the table
    - id: H27_<cell>_<arm>_100_rounds
      claim: over 100 rounds, <cell> in arm <arm> ends at a different price level than without a channel
      contrast: <arm> minus B0, both at 100 rounds, paired by seed
      outcome: collusion_index           # over all 100 rounds, unclipped
      test: exact paired sign-flip permutation test on the mean difference, two-sided (4,096 sign patterns)
      alpha: 0.05
      holm: extension_100                # over every hypothesis of this section
      supported_if: >-
        the Holm-adjusted p is below alpha, and the mean difference is positive for C1, the open channel without a
        restriction; for C1cap and C1notice the direction is reported, and a positive difference says the restriction
        leaves a rise over 100 rounds

  reading:
    horizon: compared descriptively with the 50-round result of the same cell; never pooled with it
    power: 12 pairs detect only a large effect

  secondary: [markup_ratio, bid_gap, joint_profit_ratio, switch_gain]   # same test, Holm within this family per contrast

  descriptive:
    - the block index by 10-round block, rounds 1-100, by arm, with 95% bootstrap intervals over sessions
    - channel use and the messages-v1 labels as channel_extensions

  exclusions: as channel_extensions
  reporting: as channel_extensions; analyze.py logs/extension_100, contrasts committed before this section
