# Model aliases used by the other configs.
# The first four slugs were verified against the live OpenRouter list on 2026-10-03, gpt-luna and gemini on
# 2026-10-06; all support tool calling.
# Prices are USD per million tokens, input/output. For deepseek and gpt-oss they are the pinned
# primary host's prices (PLANNING.md 5.5); qwen has one provider (Alibaba) and is not pinned, and
# glm's is the headline listing price, which is the cheapest endpoint and not a guaranteed rate,
# until its Phase B host is chosen.

models:
  deepseek:
    slug: deepseek/deepseek-v4.1-flash   # DeepSeek V4.1 Flash
    price_in: 0.07
    price_out: 0.60
    reasoning: {enabled: false}          # effort low is ignored at a 400-token cap: thinking uses it all. configs/pilot.yaml turns it on at 4,000
    providers:                           # Phase A hosts; never switch hosts inside a session
      # Morph (the first choice) was dropped on 2026-10-03: 502s in pilot_tiny, uptime 88.6% over 5 minutes, no forced tool choice.
      # Makora was left out for its $0.99 output price. Rerun a failed session with --host fallback, then --host backup.
      # Reordered on 2026-10-10 for speed: 8 calls each at the sweep's settings gave about 200 tok/s on InferenceNet and
      # CoreWeave against 70 on DeepInfra. Every run up to that date used DeepInfra (then primary), so a run compared
      # against that data, or the rest of a run started before it, needs --host deepseek=backup. NextBit (the old fallback)
      # is no longer listed.
      primary: {name: InferenceNet, slug: inference-net, quantization: fp8, price_in: 0.07, price_out: 0.60}
      fallback: {name: CoreWeave, quantization: fp8, price_in: 0.20, price_out: 0.65}
      backup: {name: DeepInfra, quantization: fp8, price_in: 0.14, price_out: 0.42}
  gpt-oss:
    slug: openai/gpt-oss-120b            # GPT-oss-120b
    price_in: 0.05
    price_out: 0.25
    reasoning: {effort: low}             # cannot be turned off; low keeps replies at about 100-250 tokens
    providers:
      primary: {name: Crusoe, quantization: bf16, price_in: 0.05, price_out: 0.25}
      fallback: {name: AkashML, quantization: bf16, price_in: 0.037, price_out: 0.187}
      backup: {name: DekaLLM, quantization: bf16, price_in: 0.03, price_out: 0.18}
  glm:
    slug: z-ai/glm-5.3-flash             # GLM-5.3 Flash, Phase B only; host not chosen
    price_in: 0.02625
    price_out: 0.90
  qwen:
    slug: qwen/qwen3.7-flash             # Qwen3.7 Flash, in the Phase A pilot and Phase B; single provider (Alibaba)
    price_in: 0.03                       # cached input is 0.006
    price_out: 0.13
    reasoning: {enabled: false}          # same as deepseek (the pilot overrides it with effort low at a 4,000-token cap)
  # Added 2026-10-06 for the follow-up runs (PLANNING.md 7.4). Not smoke-tested, no host pinned, reasoning setting
  # not chosen (the config default applies). Prices are the headline listing.
  gpt-luna:
    slug: openai/gpt-6-luna              # GPT-6 Luna; endpoints: OpenAI, Azure, Amazon Bedrock
    price_in: 0.10
    price_out: 0.50
    # No endpoint lists `temperature` as supported, and a pinned request that carries it is rejected (404, 2026-10-10),
    # so it is not sent: gpt-luna samples at its own default, whatever llm.temperature says. The run costs_revealed
    # was unpinned and did send it; it was most likely dropped there without notice.
    send_temperature: false
    # Automatic caching bills every prompt of 1,024 tokens or more as a cache write at 1.25 times the input price, and
    # our prompts are never read back: each round inserts a history row mid-message, so no later prompt starts with an
    # earlier one. Off from 2026-10-23 (runs channel_extensions and luna_long on); every earlier Luna run had it on.
    cache_writes: false
    providers:
      # Pinned on 2026-10-10 so a session cannot move between OpenAI, Azure and Bedrock. The standard endpoint, not
      # openai/flex. quantization null sends no quantization filter: this endpoint matches none, not even `unknown`.
      primary: {name: OpenAI, quantization: null, price_in: 0.10, price_out: 0.50}
  gemini:
    slug: google/gemini-3.8-flash        # Gemini 3.8 Flash; endpoints: Google AI Studio, Google (Vertex)
    price_in: 0.75                       # only the Google AI Studio endpoints list `temperature`
    price_out: 3.75                      # about 9 times deepseek's output price
    providers:
      # The trace judge (scripts/judge_traces.py) calls this host. Flex is half the standard price; on 16 traces
      # judged on both (2026-10-10) it was as fast (3.3 s against 3.4 s median) and gave the same labels on all 16.
      primary: {name: Google AI Studio, slug: google-ai-studio/flex, quantization: unknown, price_in: 0.375, price_out: 1.875}
  # Added 2026-10-23 as the third model family. Slug, prices and endpoint checked against the live OpenRouter list
  # on 2026-10-23.
  haiku:
    slug: anthropic/claude-haiku-5.5     # Claude Haiku 5.5; endpoints: Anthropic, Google (Vertex), Azure, Amazon Bedrock
    price_in: 0.10
    price_out: 0.50
    reasoning: {effort: high}
    # The Anthropic endpoint lists neither `temperature` nor `seed`; require_parameters rejects a request carrying either
    # (404, 2026-10-23), so neither is sent and Haiku samples at its own default.
    send_temperature: false
    send_seed: false
    providers:
      primary: {name: Anthropic, slug: anthropic, quantization: null, price_in: 0.10, price_out: 0.50}
