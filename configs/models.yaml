# Model aliases used by the other configs.
# All four slugs were verified against the live OpenRouter list on 2026-10-03 and support tool calling.
# Prices are USD per million tokens, input/output: the headline listing price, which is the cheapest
# endpoint and not a guaranteed rate; actual prices depend on provider routing (PLANNING.md 5.3).

models:
  deepseek:
    slug: deepseek/deepseek-v4.1-flash     # DeepSeek V4.1 Flash
    price_in: 0.02
    price_out: 0.60
  gpt-oss:
    slug: openai/gpt-oss-120b     # GPT-oss-120b
    price_in: 0.037
    price_out: 0.17
  glm:
    slug: z-ai/glm-5.3-flash     # GLM-5.3 Flash
    price_in: 0.02625
    price_out: 0.90
  qwen:
    slug: qwen/qwen3.7-flash   # Qwen3.7 Flash, Phase B only
    price_in: 0.03        # OpenRouter list price; cached input is 0.006
    price_out: 0.13
