# Supporting ablation: same-model vs. mixed lineup. Reduced scale: one mixed lineup,
# 9 sessions. Descriptive context for the main claim, not a confirmatory result.
# A mixed lineup needs several models by definition, so this is the one supporting
# ablation that is not DeepSeek-only. The same-model arm is the `random` cells of
# main_tiebreak.yaml. Model-to-firm-slot assignment is randomised per session.
# history_window 0 is the matched one-shot control: same seeds, so same costs and
# same slot assignment as the repeated arm.

inherits: base.yaml

session:
  n_sessions: 9

llm:
  max_output_tokens: TBD  # Phase B output cap and thinking mode are undecided (PLANNING.md 5.6, 7.2);
  reasoning_mode: TBD     # the runner refuses to call models until both are set

budget:
  max_cost_usd: 0.3       # PLACEHOLDER: Phase B budget not set; estimate at listed prices is 0.42

cells:
  - id: hetero-deepseek-gpt-oss-glm      # (open) which models make up the mixed lineup
    lineup: {type: heterogeneous, models: [deepseek, gpt-oss, glm]}

sweep:
  history_window: [null, 0]
