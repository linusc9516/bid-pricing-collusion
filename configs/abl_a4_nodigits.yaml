# A4: DeepSeek with the open channel and every digit 0-9 removed from each message before it is stored and shown; the
# channel paragraph says so (prompts.CHANNEL_DIGITS). Test H23, against channel_c1's DeepSeek C1. Run id:
# channel_ablations.

inherits: abl_common.yaml

budget:
  max_cost_usd: 4.24      # tripwire, set to the dry-run estimate (every call at the whole 4,000-token cap)

cells:
  - id: nodigits-deepseek
    lineup: {type: homogeneous, model: deepseek}
    channel: {enabled: true, strip_digits: true}
