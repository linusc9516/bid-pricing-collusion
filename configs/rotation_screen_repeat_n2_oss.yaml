# DRAFT, run on request 2026-10-04. Repeated-interaction prompt (v2-repeat) at N = 2, gpt-oss only.
# 25 rounds, increment 0.01, thinking at low effort (gpt-oss default), tie rule random; repeated sessions plus
# matched one-shot controls (history_window 0), which get the same system prompt. See ROTATION_ELICITATION_PLAN.md (A6).

inherits: base.yaml

auction:
  tie_break_rule: random
  n_bidders: 2
  n_rounds: 25

session:
  n_sessions: 5
  base_seed: 991000

prompt:
  template: prompts/bidder_system_repeat.md   # adds one sentence: same firms every round, similar strategies
  version: v2-repeat

llm:
  max_output_tokens: 4000
  request_timeout_s: 300

budget:
  max_cost_usd: 1         # tripwire: the user's per-run ceiling
  estimate_output_tokens: 4000

cells:
  - id: repeatn2-gpt-oss
    lineup: {type: homogeneous, model: gpt-oss}

sweep:
  history_window: [null, 0]
