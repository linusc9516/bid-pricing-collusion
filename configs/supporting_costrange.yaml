# Supporting ablation: common-cost draw. Costs are a round-wide market level (uniform on
# [cost_low + s, cost_high - s]) plus an independent U[-s, s] per firm, s = 5, so a round's costs lie
# within 10 of each other. N = 2, DeepSeek, same settings as rotation_screen_n2.yaml, which is the
# i.i.d.-cost comparison (its n2-deepseek cell; seeds 991000+, so the cost draws are different).
# The benchmark is the numeric equilibrium (bne.py CommonCostBenchmark), not the closed form, and the
# prompt template states the common-cost structure. history_window 0 is the matched one-shot control.
# Descriptive context, not a confirmatory result. Run id: costrange. Check the logs with
#   check_logs.py logs/costrange --template prompts/bidder_system_common.md

inherits: base.yaml

auction:
  tie_break_rule: random
  n_bidders: 2
  n_rounds: 25
  cost_spread: 5

session:
  n_sessions: 5
  base_seed: 992000       # disjoint from the pilot, the screen (991000) and common_cost_check (981000)

prompt:
  template: prompts/bidder_system_common.md
  version: v1-common

llm:
  max_output_tokens: 4000
  request_timeout_s: 300
  reasoning_overrides:
    deepseek: {effort: low}

budget:
  max_cost_usd: 3         # tripwire; the dry run below is the estimate
  estimate_output_tokens: 4000

cells:
  - id: costrange-deepseek
    lineup: {type: homogeneous, model: deepseek}

sweep:
  history_window: [null, 0]
