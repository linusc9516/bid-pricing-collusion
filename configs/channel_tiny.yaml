# Pre-run check for the open message channel: one 3-round session per model, two communication steps each.
# Read the message calls in calls.jsonl and messages.jsonl by hand before channel_screen_n2.yaml.

inherits: base.yaml

auction:
  n_rounds: 3
  n_bidders: 2

session:
  n_sessions: 1
  base_seed: 980000

channel:
  enabled: true

budget:
  max_cost_usd: 0.1
  estimate_output_tokens: 1000

cells:
  - id: tiny-deepseek
    lineup: {type: homogeneous, model: deepseek}
  - id: tiny-gpt-oss
    lineup: {type: homogeneous, model: gpt-oss}
