# Ablation 3: number of bidders.
# Same-model self-play, full history. N = 3 is the baseline cell from
# ablation_info.yaml and is not rerun here.

inherits: base.yaml

cells:
  - id: homog-deepseek
    lineup: {type: homogeneous, model: deepseek}
  - id: homog-gpt-oss
    lineup: {type: homogeneous, model: gpt-oss}
  - id: homog-glm
    lineup: {type: homogeneous, model: glm}
  - id: homog-qwen
    lineup: {type: homogeneous, model: qwen}

sweep:
  n_bidders: [2, 5]
