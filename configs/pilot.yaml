# Phase A pilot: pre-team proof of concept (PLANNING.md section 7.1).
# Three models (cheap candidate research models) x three tie-break rules, 5 sessions of
# 25 rounds, each with a matched one-shot control (history_window 0). 18 cells, 6,750 calls
# plus BAFO rebids, estimated at about $1.81 at 1,000 output tokens per call with the hosts
# pinned in PLANNING.md 5.5 (Morph for deepseek, Crusoe for gpt-oss); qwen has one provider
# (Alibaba), so no host is pinned. Thinking is off for deepseek and qwen, low for gpt-oss (5.6).
# Output is PILOT_FINDINGS.md: raw numbers, "n = 5, directional only". Not a paper result.
# Also measures what the Phase B budget depends on: tokens per call, parse-failure rate,
# and how often bids tie at the 0.01 grid.
# Uses its own seeds, so pilot sessions are never part of the analysed data.

inherits: base.yaml

auction:
  n_rounds: 25

session:
  n_sessions: 5
  base_seed: 990000       # disjoint from the main experiment's seeds

llm:
  max_output_tokens: 1000 # the pilot's cap; the same figure as the stress-case cost estimate below

budget:
  max_cost_usd: 2         # tripwire inside the $10 Phase A budget; estimate about 1.81 at 1,000 output tokens per call
  estimate_output_tokens: 1000  # stress case for reasoning models (PLANNING.md 5.4)

cells:
  - id: pilot-deepseek
    lineup: {type: homogeneous, model: deepseek}
  - id: pilot-gpt-oss
    lineup: {type: homogeneous, model: gpt-oss}
  - id: pilot-qwen
    lineup: {type: homogeneous, model: qwen}

sweep:
  tie_break_rule: [random, least_wins, bafo]
  history_window: [null, 0]
