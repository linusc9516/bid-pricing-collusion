# Ablation 1: information revelation.
# Same-model self-play at N = 3, varying what history each firm sees.
# The `full` level is the baseline cell shared with the other two ablations.

inherits: base.yaml

cells:
  - id: homog-deepseek
    lineup: {type: homogeneous, model: deepseek}
  - id: homog-gpt-oss
    lineup: {type: homogeneous, model: gpt-oss}
  - id: homog-glm
    lineup: {type: homogeneous, model: glm}
  - id: homog-qwen
    lineup: {type: homogeneous, model: qwen}

sweep:
  info_condition: [full, winner_price, winner_only]
