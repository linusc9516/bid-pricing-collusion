# R2: DeepSeek with the open channel and messages cut to 50 characters, against channel_c1's DeepSeek cell (500). Test
# H14. A rotation fits in about 20 characters, so the cap tests length, not the possibility of agreeing.

inherits: ext_common.yaml

budget:
  max_cost_usd: 4.24      # tripwire, set to the dry-run estimate (every call at the whole 4,000-token cap)

cells:
  - id: cap-deepseek
    lineup: {type: homogeneous, model: deepseek}
    channel: {enabled: true, max_chars: 50}
