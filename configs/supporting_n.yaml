# Supporting ablation: number of bidders. Reduced scale: DeepSeek only, 9 sessions.
# Descriptive context for the main claim, not a confirmatory result.
# N = 3 is the DeepSeek `random` cell of main_tiebreak.yaml and is not rerun here.
# history_window 0 is the matched one-shot control at each N.

inherits: base.yaml

session:
  n_sessions: 9

llm:
  max_output_tokens: TBD  # Phase B output cap and thinking mode are undecided (PLANNING.md 5.6, 7.2);
  reasoning_mode: TBD     # the runner refuses to call models until both are set

budget:
  max_cost_usd: 0.8       # PLACEHOLDER: Phase B budget not set; estimate at listed prices is 1.04

cells:
  - id: homog-deepseek
    lineup: {type: homogeneous, model: deepseek}

sweep:
  n_bidders: [2, 5]
  history_window: [null, 0]
