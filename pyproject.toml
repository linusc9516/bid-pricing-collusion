[project]
name = "bidrig"
version = "0.1.0"
description = "Tacit bid-rotation collusion among LLM bidders in sealed-bid procurement auctions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",        # OpenRouter is OpenAI-compatible
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bidrig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
